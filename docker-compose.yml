services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  agent:
    build: .
    command: uvicorn src.agent.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  mcp-server:
    build: .
    command: python -m src.mcp_server.server
    env_file: .env
    environment:
      AGENT_URL: http://agent:8000
    depends_on:
      - agent

volumes:
  qdrant_data:
