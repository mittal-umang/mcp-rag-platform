apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels: { app: mcp-server }
spec:
  replicas: {{ .Values.mcpServer.replicas }}
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      containers:
        - name: mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "src.mcp_server.server"]
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            - name: QDRANT_URL
              value: "{{ .Values.agent.env.QDRANT_URL }}"
