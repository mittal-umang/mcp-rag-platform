{{- if .Values.vllm.enabled }}
# Phase 2: self-hosted inference. Rendered only when vllm.enabled=true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: { app: vllm }
spec:
  replicas: 1
  selector:
    matchLabels: { app: vllm }
  template:
    metadata:
      labels: { app: vllm }
    spec:
      containers:
        - name: vllm
          image: {{ .Values.vllm.image }}
          args:
            - "--model"
            - "{{ .Values.vllm.model }}"
            - "--port"
            - "{{ .Values.vllm.port }}"
          ports:
            - containerPort: {{ .Values.vllm.port }}
          resources: {{- toYaml .Values.vllm.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels: { app: vllm }
spec:
  selector: { app: vllm }
  ports:
    - port: {{ .Values.vllm.port }}
      targetPort: {{ .Values.vllm.port }}
{{- end }}
