[project]
name = "mcp-rag-platform"
version = "0.1.0"
description = "RAG agent behind an MCP server, deployed on Kubernetes with observability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "mcp>=1.0,<2.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
